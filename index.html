<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자야구 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>숫자야구 게임</h1>
    <div id="desc-area" style="margin-bottom:24px; font-size:1.15rem; color:#636e72; text-align:center;">
      <b>게임 방법:</b> 서로 다른 숫자로 이루어진 정답을 맞히세요.<br>
      각 자리에는 0~9 중복 없이 입력합니다.<br>
      <b>예시:</b> 정답이 1234이고, 1357을 입력하면 → 1스트라이크 1볼 2아웃 !<br>
      <span style="font-size:0.98rem; color:#b2bec3;">(스트라이크: 자리와 숫자 모두 일치, 볼: 숫자만 일치, 아웃: 모두 불일치)</span>
    </div>
    <div id="game-area">
      <div id="settings-area" class="hidden">
        <label for="digit-select">자리수 선택:</label>
        <select id="digit-select">
          <option value="3">3자리</option>
          <option value="4" selected>4자리</option>
          <option value="5">5자리</option>
          <option value="6">6자리</option>
        </select>
      </div>
      <button id="start-btn">게임 시작</button>
      <div id="answer-area" class="hidden">정답: <span id="answer-value"></span></div>
      <div id="input-area" class="hidden">
        <div id="number-inputs"></div>
        <button id="submit-btn">입력</button>
      </div>
      <div id="result-area"></div>
      <div id="chance-area"></div>
      <div id="history-area">
        <h3>기록</h3>
        <ul id="history-list"></ul>
      </div>
      <button id="restart-btn" class="hidden">재시작</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
